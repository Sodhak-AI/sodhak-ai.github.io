<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SODHAK AI — a checkpoint between your people and AI</title>

<meta property="og:description" content="See every AI tool in use. Clean what goes into them. Keep the record.">
<meta property="og:image" content="https://www.sodhak.ai/img/overview.jpg">
<meta property="og:url" content="https://www.sodhak.ai/">
<meta name="theme-color" content="#05070b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#05070B}
a{color:#FFB454;text-decoration:none}a:hover{color:#FFD08A}
:root{--grad:linear-gradient(100deg,#FFB454 0%,#FF6A45 34%,#E6303C 64%,#D4256B 100%)}
@property --sd-a{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ---------- shared motion ---------- */
@keyframes sd-rise{from{transform:translateY(112%) rotate(4deg)}to{transform:none}}
@keyframes sd-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sd-fadein{from{opacity:0}to{opacity:1}}
@keyframes sd-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sd-spin{to{transform:rotate(360deg)}}
@keyframes sd-spin-a{to{--sd-a:360deg}}
@keyframes sd-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes sd-prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sd-reveal{from{opacity:0;transform:translateY(64px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sd-sheen{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes sd-gradmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.sd-w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.14em;margin-bottom:-.14em}
.sd-w>span{display:inline-block;animation:sd-rise 1s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 70ms + 350ms)}
.sd-in{animation:sd-up .9s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 90ms + 900ms)}
.sd-btn{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s}
.sd-btn:hover{transform:translateY(-2px) scale(1.03)}
.sd-nav a.sd-nl{color:#AAB4C2;transition:color .2s}
.sd-nav a.sd-nl:hover{color:#F4F6FA}
.sd-prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);transform-origin:0 50%;transform:scaleX(0)}
.sd-gradtext{background:var(--grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sd-gradmove 9s ease-in-out infinite}

/* ---------- steps: sticky stack + vignettes ---------- */
@property --on{syntax:'<number>';inherits:true;initial-value:0}
.sd-step{position:sticky}
.sd-kick{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8A95A6}
@keyframes sd-recede{to{transform:scale(.94);filter:brightness(.5)}}

@keyframes sd-blip{0%{transform:scale(1.9);box-shadow:0 0 0 0 var(--bc);opacity:1}18%{transform:scale(1)}100%{transform:scale(1);box-shadow:0 0 0 16px transparent;opacity:.42}}
@keyframes sd-bliptxt{0%{opacity:1;color:#FFFFFF}30%{opacity:1}100%{opacity:.5}}
.sd-blip{position:absolute;display:flex;align-items:center;gap:9px;white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#C3CBD7}
.sd-blip i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bc);animation:sd-blip 6s linear infinite;animation-delay:var(--d)}
.sd-blip b{font-weight:400;animation:sd-bliptxt 6s linear infinite;animation-delay:var(--d)}

@keyframes sd-on1{0%,17%{--on:0}19%,93%{--on:1}97%,100%{--on:0}}
@keyframes sd-on2{0%,25%{--on:0}27%,93%{--on:1}97%,100%{--on:0}}
@keyframes sd-on3{0%,33%{--on:0}35%,93%{--on:1}97%,100%{--on:0}}
@keyframes sd-on4{0%,41%{--on:0}43%,93%{--on:1}97%,100%{--on:0}}
@keyframes sd-on5{0%,49%{--on:0}51%,93%{--on:1}97%,100%{--on:0}}
@keyframes sd-beam{0%{top:0;opacity:0}4%{opacity:1}60%{top:100%;opacity:1}66%,100%{top:100%;opacity:0}}
.sd-o1{animation:sd-on1 7s linear infinite}.sd-o2{animation:sd-on2 7s linear infinite}.sd-o3{animation:sd-on3 7s linear infinite}.sd-o4{animation:sd-on4 7s linear infinite}.sd-o5{animation:sd-on5 7s linear infinite}
.sd-tk{border-radius:4px;padding:1px 4px;margin:0 -4px;color:color-mix(in srgb,var(--tc) calc(var(--on) * 100%),#8A95A6);background:color-mix(in srgb,var(--tc) calc(var(--on) * 15%),transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--tc) calc(var(--on) * 45%),transparent)}
.sd-fc{opacity:var(--on);transform:translateY(calc((1 - var(--on)) * 10px))}

@keyframes sd-win1{0%{--on:0}3%,30%{--on:1}33%,100%{--on:0}}
@keyframes sd-win2{0%,33%{--on:0}36%,63%{--on:1}66%,100%{--on:0}}
@keyframes sd-win3{0%,66%{--on:0}69%,96%{--on:1}99%,100%{--on:0}}
.sd-w1{animation:sd-win1 9s linear infinite}.sd-w2{animation:sd-win2 9s linear infinite}.sd-w3{animation:sd-win3 9s linear infinite}
.sd-seg{position:relative;flex:1;text-align:center;padding:11px 0;border-radius:999px;font-size:15px;font-weight:500;color:color-mix(in srgb,var(--tc) calc(var(--on) * 100%),#8A95A6);background:color-mix(in srgb,var(--tc) calc(var(--on) * 16%),transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) calc(var(--on) * 55%),transparent)}
.sd-lay{position:absolute;inset:0;opacity:var(--on);transform:translateY(calc((1 - var(--on)) * 12px))}
@keyframes sd-dot1{0%{left:0;opacity:0;background:#9FB4D6}3%{opacity:1}13%{left:50%;background:#9FB4D6;transform:translate(-50%,-50%) scale(1)}15%{background:#2DD4A0;transform:translate(-50%,-50%) scale(1.8)}17%{transform:translate(-50%,-50%) scale(1)}28%{left:100%;opacity:1;background:#2DD4A0}31%,100%{left:100%;opacity:0}}
@keyframes sd-dot2{0%,33%{left:0;opacity:0;background:#FFB454}36%{opacity:1}46%{left:50%;background:#FFB454;transform:translate(-50%,-50%) scale(1)}48%{background:#2DD4A0;transform:translate(-50%,-50%) scale(1.8)}50%{transform:translate(-50%,-50%) scale(1)}61%{left:100%;opacity:1;background:#2DD4A0}64%,100%{left:100%;opacity:0}}
@keyframes sd-dot3{0%,66%{left:0;opacity:0;background:#FF3B30}69%{opacity:1}79%{left:49%;opacity:1;transform:translate(-50%,-50%) scale(1)}82%{left:49%;opacity:.9;transform:translate(-50%,-50%) scale(3)}88%,100%{left:49%;opacity:0;transform:translate(-50%,-50%) scale(.2)}}
.sd-dot{position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);opacity:0}

@keyframes sd-ledger{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes sd-tick{0%,8%{opacity:.25;transform:scale(.6)}16%,100%{opacity:1;transform:scale(1)}}

/* ---------- console ---------- */
@keyframes sd-pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sd-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sd-undraw{from{stroke-dashoffset:0}to{stroke-dashoffset:-1}}
@keyframes sd-growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sd-roll{from{transform:translateY(0)}}
@keyframes sd-tilt{from{transform:perspective(1800px) rotateX(24deg) translateY(70px) scale(.88);opacity:.25}to{transform:perspective(1800px) rotateX(0deg) translateY(0) scale(1);opacity:1}}
.sd-pp{animation:sd-pop .65s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.sd-pan{background:#0E131B;border:1px solid #1A212C;border-radius:12px;box-sizing:border-box}
.sd-lab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A95A6}
.sd-mono{font-family:'IBM Plex Mono',monospace}
.sd-od{display:inline-block;height:1em;line-height:1;overflow:hidden;vertical-align:top}
.sd-od>span{display:block;animation:sd-roll 1.5s cubic-bezier(.16,.84,.24,1) both}
.sd-bar{height:100%;border-radius:3px;transform-origin:0 50%;animation:sd-growx 1s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 70ms + 250ms)}
.sd-tab{position:relative;overflow:hidden;border:0;cursor:pointer;font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;font-weight:500;height:44px;padding:0 22px;border-radius:999px;transition:background .3s,color .3s}
.sd-tabbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad);transform-origin:0 50%}
.sd-trow{display:grid;align-items:center;column-gap:10px;padding:0 4px;border-bottom:1px solid rgba(255,255,255,.05);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#C3CBD7}
.sd-trow>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width: 900px), (max-height: 740px){
.sd-step{position:relative!important;top:auto!important}
.sd-step>.sd-step-in{animation:none!important}
}
@media (max-width: 900px){.sd-navlinks{display:none!important}}
.sd-scrim{background:radial-gradient(58% 64% at 20% 50%,rgba(5,7,11,.78),rgba(5,7,11,0) 72%)}
.sd-hero{align-items:center}
@media (max-width: 819px){
.sd-scrim{background:linear-gradient(180deg,rgba(5,7,11,.86) 0%,rgba(5,7,11,.7) 42%,rgba(5,7,11,0) 66%)}
.sd-hero{align-items:flex-start}
}
@media (max-width: 480px){.sd-signin{display:none!important}}
/* ---------- marquee / demo / word / pricing / cta ---------- */
.sd-mq{display:flex;width:max-content;animation:sd-marq 48s linear infinite}
@keyframes sd-chip-a{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sd-chip-b{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sd-dscan-a{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes sd-dscan-b{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes sd-row-a{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes sd-row-b{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.sd-ta{transition:border-color .2s,box-shadow .2s}
.sd-ta:focus{outline:none;border-color:#FF6A45;box-shadow:0 0 0 3px rgba(255,106,69,.22)}
.sd-pill{cursor:pointer;font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;height:44px;padding:0 18px;border-radius:999px;transition:background .2s,border-color .2s,color .2s}
.sd-pill:hover{border-color:rgba(255,255,255,.4)!important;color:#FFFFFF!important}
.sd-price{position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sd-price:hover{transform:translateY(-8px)}
.sd-spotl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,106,69,.17),rgba(255,106,69,0) 62%)}
.sd-price:hover .sd-spotl{opacity:1}
@keyframes sd-blob1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(16%,14%) scale(1.25)}}
@keyframes sd-blob2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-20%,-12%) scale(.9)}}
@keyframes sd-blob3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(10%,-18%) scale(1.2)}}
.sd-root a:focus-visible,.sd-root button:focus-visible{outline:2px solid #FFB454;outline-offset:3px}

@supports (animation-timeline: view()){
.sd-tilt{animation:sd-tilt linear both;animation-timeline:view();animation-range:entry 0% entry 100%}
.sd-prog{animation:sd-prog linear both;animation-timeline:scroll(root block)}
.sd-rv{animation:sd-reveal linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.sd-stack{timeline-scope:--sdc2,--sdc3,--sdc4}
.sd-c2{view-timeline-name:--sdc2}.sd-c3{view-timeline-name:--sdc3}.sd-c4{view-timeline-name:--sdc4}
.sd-c1>.sd-step-in{animation:sd-recede linear both;animation-timeline:--sdc2;animation-range:entry 10% entry 100%}
.sd-c2>.sd-step-in{animation:sd-recede linear both;animation-timeline:--sdc3;animation-range:entry 10% entry 100%}
.sd-c3>.sd-step-in{animation:sd-recede linear both;animation-timeline:--sdc4;animation-range:entry 10% entry 100%}
.sd-flat .sd-step>.sd-step-in{animation:none}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript>
<div style="max-width:720px;margin:0 auto;padding:96px 24px;color:#AAB4C2;font-family:system-ui,sans-serif">
<h1 style="color:#F4F6FA">SODHAK AI: a checkpoint between your people and AI</h1>
<p>Every prompt passes through SODHAK. Secrets and customer data stay in. Attacks stay out.</p>

</div>

<div id="sd-app"></div>
<template id="sd-tpl">

<!-- ================= NAV ================= -->
<header class="sd-nav" style="position: sticky; top: 0; z-index: 60; height: 72px; box-sizing: border-box; background: rgba(5,7,11,0.55); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,0.06)">
  <div style="max-width: 1280px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
    <div style="display: flex; align-items: center; gap: 36px; min-width: 0">

            <linearGradient id="sdl2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5540"></stop><stop offset="1" stop-color="#e6303c"></stop></linearGradient>
            <linearGradient id="sdl3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4256b"></stop><stop offset="1" stop-color="#b3186f"></stop></linearGradient>
          </defs>
          <path d="M96 24 C96 12 74 8 56 14 C36 21 34 40 54 48 L96 40 Z" fill="url(#sdl1)"></path>
          <path d="M54 48 C74 56 96 60 93 78 L34 86 C30 74 36 56 54 48 Z" fill="url(#sdl2)"></path>
          <path d="M93 78 C90 98 58 104 40 92 C33 87 30 80 34 72 L60 76 C70 78 82 78 93 78 Z" fill="url(#sdl3)"></path>

      </a>

    </div>
  </div>
  <div class="sd-prog" aria-hidden="true"></div>
</header>

<!-- ================= HERO + STATEMENT (one pinned 3D scene) ================= -->
<section ref="{{ jourRef }}" style="position: relative; margin-top: -72px">
  <div aria-hidden="true" style="position: sticky; top: 0; height: var(--stage, 900px); overflow: hidden">
    <sc-if value="{{ noGL }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 66%; top: 50%; width: min(520px, 62vw); aspect-ratio: 1; transform: translate(-50%, -50%) perspective(900px) rotateY(-32deg)"><div style="position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 210deg, #D4256B, #E6303C, #FF6A45, #FFB454, #FFE9C8, #FFB454, #FF6A45, #E6303C, #D4256B); -webkit-mask-image: radial-gradient(closest-side, transparent 79%, #000 81%, #000 95%, transparent 97%); mask-image: radial-gradient(closest-side, transparent 79%, #000 81%, #000 95%, transparent 97%); filter: drop-shadow(0 0 36px rgba(255,106,69,0.7)); animation: sd-spin 40s linear infinite"></div></div></sc-if>

        <span class="sd-w"><span style="--i: 0">A</span></span>
        <span class="sd-w"><span style="--i: 1">checkpoint</span></span>
        <span class="sd-w"><span style="--i: 2">between</span></span>
        <span class="sd-w"><span style="--i: 3">your</span></span>

        <a class="sd-btn" href="https://app.sodhak.ai/demo" style="background: rgba(255,255,255,0.07); color: #FFFFFF; font-weight: 500; font-size: 17px; padding: 0 clamp(20px, 2vw, 28px); height: 56px; box-sizing: border-box; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px)">See live demo</a>

    </div>
    <div style="position: absolute; right: 24px; bottom: 44px; opacity: calc(1 - var(--hs, 0) * 3.4)">
      <div class="sd-in" style="--i: 4; display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: #9AA5B6">
        <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #9FB4D6; box-shadow: 0 0 10px #9FB4D6"></span>Prompts</span>
        <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2DD4A0; box-shadow: 0 0 10px #2DD4A0"></span>Allowed</span>
        <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF3B30; box-shadow: 0 0 10px #FF3B30"></span>Caught</span>
      </div>
